kind = "web"
previewPath = "/"
title = "MarketEdge"
version = "1.0.0"
id = "artifacts/market-edge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21073

[services.development]
run = "pnpm --filter @workspace/market-edge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/market-edge", "run", "build" ]
publicDir = "artifacts/market-edge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21073"
BASE_PATH = "/"
