openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Market data from Kalshi and Polymarket
  - name: combos
    description: Combo optimization and saved combos
  - name: alerts
    description: Price-movement alerts for markets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List markets from Kalshi and Polymarket
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: platform
          in: query
          schema:
            type: string
            enum: [kalshi, polymarket, all]
          description: Filter by platform
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketsResponse"

  /markets/{platform}/{marketId}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get a single market with live odds
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [kalshi, polymarket]
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "404":
          description: Not found

  /markets/{platform}/{marketId}/history:
    get:
      operationId: getMarketHistory
      tags: [markets]
      summary: Get YES odds history for a market (last 7 days, cached 1 hr)
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [kalshi, polymarket]
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical YES odds data points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketHistoryResponse"
        "404":
          description: Not found

  /combos/smart-picks:
    post:
      operationId: generateSmartPicks
      tags: [combos]
      summary: Auto-generate 4 non-overlapping Smart Pick combos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartPicksInput"
      responses:
        "200":
          description: Four non-overlapping combos optimised for the requested risk level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartPicksResponse"
        "400":
          description: Bad request
        "500":
          description: Generation failed

  /combos/categories:
    get:
      operationId: listSmartPickCategories
      tags: [combos]
      summary: List market categories available in the live pool
      responses:
        "200":
          description: Categories with at least two live markets each
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "500":
          description: Failed to load categories

  /combos/optimize:
    post:
      operationId: optimizeCombos
      tags: [combos]
      summary: Generate ranked combo suggestions from selected markets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Ranked combo suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResponse"

  /combos:
    get:
      operationId: listCombos
      tags: [combos]
      summary: List current user's saved combos (auth required)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Saved combos with overlap info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombosListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: saveCombo
      tags: [combos]
      summary: Save a combo (auth required)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComboInput"
      responses:
        "201":
          description: Saved combo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCombo"
        "401":
          description: Unauthorized

  /combos/{comboId}:
    get:
      operationId: getCombo
      tags: [combos]
      summary: Get a saved combo with overlap status (auth required)
      security:
        - clerkAuth: []
      parameters:
        - name: comboId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Combo detail with overlap warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCombo"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteCombo
      tags: [combos]
      summary: Delete a saved combo (auth required)
      security:
        - clerkAuth: []
      parameters:
        - name: comboId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List current user's price alerts (auth required); also checks live odds and fires matched alerts
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of price alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a price alert (auth required)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertInput"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceAlert"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /alerts/{alertId}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete a price alert (auth required)
      security:
        - clerkAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MarketHistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          description: ISO 8601 timestamp
        yesOdds:
          type: number
          description: YES probability at this point (0-1)
      required:
        - timestamp
        - yesOdds

    MarketHistoryResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/MarketHistoryPoint"
          description: Chronologically ordered history points
      required:
        - points

    Market:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        title:
          type: string
        yesOdds:
          type: number
          description: Probability of YES (0-1)
        noOdds:
          type: number
          description: Probability of NO (0-1)
        volume:
          type: ["number", "null"]
        closeTime:
          type: ["string", "null"]
        url:
          type: string
        category:
          type: ["string", "null"]
      required:
        - id
        - platform
        - title
        - yesOdds
        - noOdds
        - url

    MarketsResponse:
      type: object
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/Market"
        total:
          type: integer
        hasMore:
          type: boolean
      required:
        - markets
        - total
        - hasMore

    ComboLeg:
      type: object
      properties:
        marketId:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        marketTitle:
          type: string
        position:
          type: string
          enum: [yes, no]
        odds:
          type: number
        impliedProb:
          type: number
        trueProbability:
          type: number
          description: AI-estimated true probability of the chosen side (0..1). Present on Smart Picks legs.
        edge:
          type: number
          description: trueProbability minus odds for the chosen side (positive = value). Present on Smart Picks legs.
        aiReasoning:
          type: string
          description: Short AI explanation of the estimate. Present on Smart Picks legs.
        aiConfidence:
          type: string
          enum: [low, medium, high]
          description: AI confidence in its probability estimate. Present on Smart Picks legs.
        closeTime:
          type: string
          nullable: true
          description: ISO timestamp when this market resolves (null if unknown). Present on Smart Picks legs.
      required:
        - marketId
        - platform
        - marketTitle
        - position
        - odds
        - impliedProb

    ComboSuggestion:
      type: object
      properties:
        legs:
          type: array
          items:
            $ref: "#/components/schemas/ComboLeg"
        jointProbability:
          type: number
          description: Combined implied probability of all legs hitting
        payoutMultiplier:
          type: number
          description: Implied payout multiplier (1 / jointProbability)
        diversificationWarning:
          type: boolean
          description: True if this combo shares all leg outcomes with another combo in the result set
      required:
        - legs
        - jointProbability
        - payoutMultiplier
        - diversificationWarning

    SmartPicksInput:
      type: object
      properties:
        riskLevel:
          type: string
          enum: [conservative, balanced, aggressive]
          default: balanced
        stakeAmount:
          type: number
          minimum: 1
          maximum: 100
          default: 10
        count:
          type: integer
          minimum: 1
          maximum: 4
          default: 4
        platform:
          type: string
          enum: [kalshi, polymarket, both]
          default: both
          description: Which platform(s) to draw candidate markets from
        category:
          type: string
          default: all
          description: Market category to draw candidates from ("all" for any)
        legCount:
          type: string
          enum: [auto, "2", "3", "4"]
          default: auto
          description: Number of legs per combo, or "auto" to consider 2-4 legs
        horizon:
          type: string
          enum: [any, week, month, quarter, year]
          default: any
          description: Only include markets that resolve within this window ("any" = no limit). Keeps all legs in a combo resolving on a similar timeframe.
      required: []

    SmartPickResult:
      type: object
      properties:
        legs:
          type: array
          items:
            $ref: "#/components/schemas/ComboLeg"
        jointProbability:
          type: number
        payoutMultiplier:
          type: number
        riskLevel:
          type: string
          enum: [conservative, balanced, aggressive]
        riskScore:
          type: string
          enum: [low, medium, high]
        stakeAmount:
          type: number
        estimatedPayout:
          type: number
        expectedValue:
          type: number
          description: Expected value in dollars at the given stake (positive = profitable on average)
        edgePercent:
          type: number
          description: Combined edge of the parlay as a percentage (product of edge ratios minus 1)
        rationale:
          type: string
          description: Combo-level summary of why these picks have value
      required:
        - legs
        - jointProbability
        - payoutMultiplier
        - riskLevel
        - riskScore
        - stakeAmount
        - estimatedPayout
        - expectedValue
        - edgePercent
        - rationale

    SmartPicksResponse:
      type: object
      properties:
        combos:
          type: array
          items:
            $ref: "#/components/schemas/SmartPickResult"
        generatedAt:
          type: string
      required:
        - combos
        - generatedAt

    Category:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count

    CategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - categories

    OptimizeLegInput:
      type: object
      properties:
        marketId:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        position:
          type: string
          enum: [yes, no]
      required:
        - marketId
        - platform
        - position

    OptimizeInput:
      type: object
      properties:
        legs:
          type: array
          items:
            $ref: "#/components/schemas/OptimizeLegInput"
          minItems: 2
          maxItems: 20
        maxComboSize:
          type: integer
          default: 4
          minimum: 2
          maximum: 5
        topN:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
      required:
        - legs

    OptimizeResponse:
      type: object
      properties:
        combos:
          type: array
          items:
            $ref: "#/components/schemas/ComboSuggestion"
      required:
        - combos

    ComboLegInput:
      type: object
      properties:
        marketId:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        marketTitle:
          type: string
        position:
          type: string
          enum: [yes, no]
        oddsAtSave:
          type: number
        impliedProbAtSave:
          type: number
      required:
        - marketId
        - platform
        - marketTitle
        - position
        - oddsAtSave
        - impliedProbAtSave

    ComboInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: ["string", "null"]
        legs:
          type: array
          items:
            $ref: "#/components/schemas/ComboLegInput"
          minItems: 2
      required:
        - name
        - legs

    SavedComboLeg:
      type: object
      properties:
        id:
          type: string
        marketId:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        marketTitle:
          type: string
        position:
          type: string
          enum: [yes, no]
        oddsAtSave:
          type: number
        impliedProbAtSave:
          type: number
      required:
        - id
        - marketId
        - platform
        - marketTitle
        - position
        - oddsAtSave
        - impliedProbAtSave

    SavedCombo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        note:
          type: ["string", "null"]
        createdAt:
          type: string
        legs:
          type: array
          items:
            $ref: "#/components/schemas/SavedComboLeg"
        jointProbabilityAtSave:
          type: number
        payoutMultiplierAtSave:
          type: number
        portfolioOverlapWarning:
          type: boolean
          description: True if a single outcome appears in every one of the user's saved combos
      required:
        - id
        - name
        - createdAt
        - legs
        - jointProbabilityAtSave
        - payoutMultiplierAtSave
        - portfolioOverlapWarning

    CombosListResponse:
      type: object
      properties:
        combos:
          type: array
          items:
            $ref: "#/components/schemas/SavedCombo"
        portfolioOverlapWarnings:
          type: array
          items:
            type: object
            properties:
              marketId:
                type: string
              platform:
                type: string
              marketTitle:
                type: string
              position:
                type: string
            required:
              - marketId
              - platform
              - marketTitle
              - position
      required:
        - combos
        - portfolioOverlapWarnings

    PriceAlert:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [kalshi, polymarket]
        marketId:
          type: string
        marketTitle:
          type: string
        condition:
          type: string
          enum: [above, below]
        threshold:
          type: number
          description: Probability threshold (0-1)
        isTriggered:
          type: boolean
        triggeredAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - platform
        - marketId
        - marketTitle
        - condition
        - threshold
        - isTriggered
        - createdAt

    AlertsListResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PriceAlert"
      required:
        - alerts

    CreateAlertInput:
      type: object
      properties:
        platform:
          type: string
          enum: [kalshi, polymarket]
        marketId:
          type: string
        marketTitle:
          type: string
        condition:
          type: string
          enum: [above, below]
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Probability threshold (0-1)
      required:
        - platform
        - marketId
        - marketTitle
        - condition
        - threshold
